<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Java Network Terminal</title>
<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #ddd;
    font-family: "Courier New", monospace;
    overflow: hidden;
}

body {
    display: flex;
    flex-direction: column;
    position: relative;
}

/* =================================
   MATRIX BACKGROUND
================================= */

#matrix {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    display: block;
}

/* =================================
   HEADER
================================= */

.header {
    position: relative;
    z-index: 1;
    height: 56px;
    border-bottom: 1px solid #333;
    display: flex;
    align-items: center;
    padding: 0 12px;
    background: rgba(5, 5, 5, 0.85);
    backdrop-filter: blur(2px);
    flex-shrink: 0;
}

.logo {
    color: #00ff88;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 0.5px;
    white-space: nowrap;
}

.status {
    margin-left: auto;
    color: #00ff88;
    font-size: 11px;
    white-space: nowrap;
    padding-left: 8px;
}

/* =================================
   TERMINAL
================================= */

.terminal {
    position: relative;
    z-index: 1;
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 12px;
    background: rgba(0, 0, 0, 0.55);
}

.line {
    margin-bottom: 8px;
    line-height: 1.5;
    word-wrap: break-word;
    overflow-wrap: break-word;
    font-size: 13px;
    white-space: pre-wrap;
}

.system {
    color: #00aaff;
}

.server {
    color: #00ff88;
}

.client {
    color: #fff;
}

.error {
    color: #ff4444;
}

.data {
    color: #ffaa00;
}

.time {
    color: #666;
    font-size: 11px;
}

/* =================================
   INPUT
================================= */

.input-area {
    position: relative;
    z-index: 1;
    border-top: 1px solid #333;
    padding: 10px 12px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    background: rgba(5, 5, 5, 0.9);
    display: flex;
    align-items: center;
    flex-shrink: 0;
}

.prompt {
    color: #00ff88;
    font-weight: bold;
    margin-right: 8px;
    font-size: 13px;
    white-space: nowrap;
}

input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: #fff;
    font-family: "Courier New", monospace;
    font-size: 16px; /* keep >=16px to prevent iOS zoom */
}

input::placeholder {
    color: #555;
    font-size: 13px;
}

/* =================================
   SCROLLBAR
================================= */

::-webkit-scrollbar {
    width: 6px;
}

::-webkit-scrollbar-track {
    background: #050505;
}

::-webkit-scrollbar-thumb {
    background: #333;
}

/* =================================
   RESPONSIVE BREAKPOINTS
================================= */

@media (max-width: 480px) {
    .logo {
        font-size: 13px;
    }
    .status {
        font-size: 10px;
    }
    .line {
        font-size: 12px;
    }
    .prompt {
        font-size: 12px;
    }
}

@media (max-width: 360px) {
    .logo {
        font-size: 11px;
    }
    .header {
        padding: 0 8px;
        height: 50px;
    }
    .terminal {
        padding: 8px;
    }
    .line {
        font-size: 11px;
    }
}

@media (min-width: 900px) {
    .terminal {
        padding: 20px;
    }
    .line {
        font-size: 14px;
    }
    .logo {
        font-size: 20px;
    }
    .status {
        font-size: 14px;
    }
}

</style>
</head>

<body>

<canvas id="matrix"></canvas>

<!-- =================================
     HEADER
================================= -->
<div class="header">
    <div class="logo">JAVA NETWORK TERMINAL</div>
    <div id="status" class="status">● SERVER CONNECTING</div>
</div>

<!-- =================================
     TERMINAL
================================= -->
<div id="terminal" class="terminal">
    <div class="line system">[SYSTEM] Initializing network terminal...</div>
</div>

<!-- =================================
     INPUT
================================= -->
<div class="input-area">
    <span class="prompt">root@server:~#</span>
    <input
        id="message"
        type="text"
        placeholder="Type message..."
        autocomplete="off"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
    >
</div>

<script src="/socket.io/socket.io.js"></script>

<script>

// ==========================================
// MATRIX RAIN BACKGROUND
// ==========================================

const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

let width, height, columns, drops, fontSize;

const chars = "10101010101010101010101010101010101010101010101010101010101010101010101011";

function resizeMatrix() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;

    // scale font size down on small screens for denser but readable rain
    fontSize = width < 400 ? 12 : (width < 700 ? 14 : 16);

    columns = Math.floor(width / fontSize);
    drops = new Array(columns).fill(1);
}

resizeMatrix();
window.addEventListener("resize", resizeMatrix);

function drawMatrix() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
    ctx.fillRect(0, 0, width, height);

    ctx.fillStyle = "#00ff88";
    ctx.font = fontSize + "px monospace";

    for (let i = 0; i < drops.length; i++) {
        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        const x = i * fontSize;
        const y = drops[i] * fontSize;

        ctx.fillText(text, x, y);

        if (y > height && Math.random() > 0.975) {
            drops[i] = 0;
        }

        drops[i]++;
    }
}

setInterval(drawMatrix, 40);

// ==========================================
// TERMINAL LOGIC
// ==========================================

const socket = io();

const terminal = document.getElementById("terminal");
const input = document.getElementById("message");
const status = document.getElementById("status");


function addLine(text, className = "") {
    const line = document.createElement("div");
    line.className = "line " + className;
    line.textContent = text;
    terminal.appendChild(line);
    terminal.scrollTop = terminal.scrollHeight;
}


socket.on("connect", () => {
    status.textContent = "● SERVER ONLINE";
    status.style.color = "#00ff88";

    addLine("[SYSTEM] Connected to Node.js server.", "system");
    addLine("[SYSTEM] Waiting for Java clients...", "system");
});


socket.on("disconnect", () => {
    status.textContent = "● SERVER OFFLINE";
    status.style.color = "#ff4444";

    addLine("[SYSTEM] Connection lost.", "error");
});


socket.on("clientData", (data) => {
    addLine("[CLIENT DATA]", "data");
    addLine(JSON.stringify(data, null, 2), "client");
});


socket.on("serverChat", (data) => {
    addLine("[SERVER → CLIENTS] " + data.message, "server");
});


function sendMessage() {
    const message = input.value.trim();
    if (!message) return;

    socket.emit("webMessage", { message: message });
    input.value = "";
}


input.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
        sendMessage();
    }
});

</script>

</body>
</html>
